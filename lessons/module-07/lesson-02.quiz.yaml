- id: q1
  question: >-
    You add a code task whose golden tests you wrote from the ticket. `validate --repo` reports that
    the golden tests already pass on the unmodified repository. What does that mean?
  options:
    - >-
      The reference solution is wrong and should be rewritten before the task is used.
    - >-
      The task is easy, which is fine for a golden task that must never regress.
    - >-
      The task measures nothing: an agent that changes no code at all would pass it.
    - >-
      The repository already contains the fix, so the task should move to the holdout split.
  correct: 2
  explanation: >-
    Golden tests for a code task must fail before the fix and pass after it. If they pass on the
    untouched code, doing nothing passes the task, so it cannot tell a good change from no change.
- id: q2
  question: >-
    After two weeks of tuning the rules file against failing tasks, dev pass rate rose from 61% to
    94% while holdout stayed at 70%. What is the most likely explanation?
  options:
    - >-
      The layer has been fitted to the dev tasks rather than improving work on the codebase.
    - >-
      The holdout tasks are harder, so the gap is expected and can be safely ignored.
    - >-
      The model improved during those two weeks and the holdout has simply not caught up.
    - >-
      The holdout is too small to measure anything, so only the dev score is meaningful.
  correct: 0
  explanation: >-
    Holdout exists to reveal a growing dev-holdout gap. Tuning against visible failures can raise
    dev scores through answer leakage or narrow fixes that do not generalize to unseen tasks.
- id: q3
  question: >-
    Which rules-file line is answer leakage rather than a legitimate fix for a failing task?
  options:
    - >-
      "Never edit a merged V### script; add a new one." with a pointer to the history file.
    - >-
      "Money is decimal(19,4) in SQL Server and decimal in C#; never double."
    - >-
      "Every V### migration ships with a matching U### undo script from V003 on."
    - >-
      "If asked which files to create for PoNumber, answer V005 and U005 add_po_number."
  correct: 3
  explanation: >-
    The first three are general facts with evidence that help on any task. The last copies a
    specific task and its expected answer, so it raises the score without making the agent better.
- id: q4
  question: >-
    Your regex grader for a task passes its reference answer and rejects "banana". Why is that not
    enough validation?
  options:
    - >-
      Regex graders can never be validated and should always be replaced by an LLM judge.
    - >-
      The counterexample must be a plausible wrong answer, such as the stale convention.
    - >-
      Validation also needs the task to be run at least five times against a real agent.
    - >-
      The reference answer should be generated by the agent rather than written by hand.
  correct: 1
  explanation: >-
    A counterexample tests the grader only if it is a mistake an agent might really make. A grader
    that rejects nonsense but accepts DateTimeOffset.UtcNow or V004 has not been tested at all.
